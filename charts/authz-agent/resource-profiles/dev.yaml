# Dev resource profile for authz-agent.
# Keep the dev install small:
#   authz-agent:        364Mi RAM / 350m CPU
#   authz-policy-admin:  64Mi RAM /  50m CPU (only when it is enabled)
#
# The agent's numbers are what the five containers it replaced asked for
# between them (authz-agent-ADR-0080), not a measurement.
AUTHZ_AGENT_CPU_REQUEST: 350m
AUTHZ_AGENT_CPU_LIMIT: 400m
AUTHZ_AGENT_MEM_REQUEST: 364Mi
AUTHZ_AGENT_MEM_LIMIT: 700Mi

# Only applied when AUTHZ_POLICY_ADMIN_ENABLED is true (authz-agent-ADR-0073).
AUTHZ_POLICY_ADMIN_CPU_REQUEST: 50m
AUTHZ_POLICY_ADMIN_CPU_LIMIT: 100m
AUTHZ_POLICY_ADMIN_MEM_REQUEST: 64Mi
AUTHZ_POLICY_ADMIN_MEM_LIMIT: 128Mi
