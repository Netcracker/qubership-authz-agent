# Prod resource profile for authz-agent.
#
# Until this file was fixed it was a byte-for-byte copy of dev.yaml (100m CPU /
# 100Mi RAM everywhere) while its own header promised several CPUs — installing
# "prod" silently got you the dev sizing, and 100m CPU means permanent
# throttling under any real traffic.
#
# The numbers below are the SVT sizing: what the service under test is given on
# the load stand, with requests deliberately below limits so a run can push the
# containers into their limits and CPU throttling stays observable. They are a
# starting point derived from the compose SVT reference
# (tests/svt/common/compose/docker-compose.yml: backend `cpus: 8`,
# `mem_limit: 8g`), not a measurement — re-derive them from the first real SVT
# run before this profile is used for a production install.
# The single service, when AUTHZ_SINGLE_SERVICE_ENABLED is on: it evaluates
# every request, as OPA did, and runs the pull loop and the JWKS bootstrap
# beside it, so it takes OPA's sizing with pap-client's memory added.
AUTHZ_AGENT_CPU_REQUEST: "4"
AUTHZ_AGENT_CPU_LIMIT: "8"
AUTHZ_AGENT_MEM_REQUEST: 2Gi
AUTHZ_AGENT_MEM_LIMIT: 8Gi

ENVOY_CPU_REQUEST: "2"
ENVOY_CPU_LIMIT: "4"
ENVOY_MEM_REQUEST: 512Mi
ENVOY_MEM_LIMIT: 1Gi

# The former single backend container is now OPA plus pap-client. OPA keeps the
# backend sizing: it evaluates every request. pap-client only pulls and converts
# policies; its memory follows the policy set (see dev.yaml), not the traffic.
OPA_CPU_REQUEST: "4"
OPA_CPU_LIMIT: "8"
OPA_MEM_REQUEST: 2Gi
OPA_MEM_LIMIT: 8Gi
PAP_CLIENT_CPU_REQUEST: 500m
PAP_CLIENT_CPU_LIMIT: "1"
PAP_CLIENT_MEM_REQUEST: 512Mi
PAP_CLIENT_MEM_LIMIT: 1Gi

COLLECTOR_CPU_REQUEST: "1"
COLLECTOR_CPU_LIMIT: "2"
COLLECTOR_MEM_REQUEST: 512Mi
COLLECTOR_MEM_LIMIT: 3Gi

# authz-policy-admin sizing. A production install should keep AUTHZ_POLICY_ADMIN_ENABLED false — the
# stub replaces access-control and its control surface is unauthenticated by
# default (authz-agent-ADR-0073). These numbers exist so that a staging or
# demo namespace installed with the prod profile still renders sane limits; the
# stub only serves a few megabytes of JSON, so it does not follow the backend's
# sizing.
AUTHZ_POLICY_ADMIN_CPU_REQUEST: 100m
AUTHZ_POLICY_ADMIN_CPU_LIMIT: 500m
AUTHZ_POLICY_ADMIN_MEM_REQUEST: 128Mi
AUTHZ_POLICY_ADMIN_MEM_LIMIT: 512Mi
