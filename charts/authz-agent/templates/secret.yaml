{{/*
authz-agent-ADR-0077: the write-path authentication secret of the data API.

Generated once per install and preserved across upgrades (see
authz-agent.opaAuthToken helper in _helpers.tpl), and read by whichever
topology is installed. In the five-container Pod the start script writes it to
${OPA_DATA_DIR}/opa-auth-secret.json as {"opa_auth_secret": "<token>"} and
passes --authentication=token to OPA; the single service reads the same file
through AUTHZ_OPA_AUTH_TOKEN_FILE and loads it as the same document.
system_authz.rego then checks input.identity == data.opa_auth_secret on
all PUT/PATCH /v1/data/** requests either way.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: '{{ include "authz-agent.serviceName" . }}-opa-auth'
  labels:
    {{- include "authz-agent.commonLabels" . | nindent 4 }}
type: Opaque
data:
  token: '{{ include "authz-agent.opaAuthToken" . | b64enc }}'
