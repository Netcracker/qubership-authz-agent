{{/*
authz-agent-ADR-0077: OPA internal write-path authentication secret.

Generated once per install and preserved across upgrades (see
authz-agent.opaAuthToken helper in _helpers.tpl). The start script reads the
token from the mounted file, writes it to ${OPA_DATA_DIR}/opa-auth-secret.json
as {"opa_auth_secret": "<token>"}, and passes --authentication=token to OPA.
system_authz.rego then checks input.identity.token == data.opa_auth_secret on
all PUT/PATCH /v1/data/** requests.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: '{{ include "authz-agent.serviceName" . }}-opa-auth'
  labels:
    {{- include "authz-agent.commonLabels" . | nindent 4 }}
type: Opaque
data:
  token: '{{ include "authz-agent.opaAuthToken" . | b64enc }}'
