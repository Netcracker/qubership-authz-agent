{{- if .Values.HPA_ENABLED }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: '{{ include "authz-agent.serviceName" . }}'
  labels:
    {{- include "authz-agent.commonLabels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: '{{ include "authz-agent.serviceName" . }}'
  minReplicas: {{ .Values.HPA_MIN_REPLICAS }}
  maxReplicas: {{ .Values.HPA_MAX_REPLICAS }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.HPA_AVERAGE_CPU_UTILIZATION }}
{{- end }}
