sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Coverage exclusions: code a unit test cannot reach.
#   test/**   parity, integration and SVT suites (own Go modules), scripts, tools
sonar.coverage.exclusions=test/**

# Analysis exclusions.
#   **/*_test.go                 Go tests, declared as tests below instead.
#   test/svt/profiler/**/*.json  the load profiler's benchmark fixtures: static
#     request bodies and data documents fed to `opa bench`, not source. Their
#     token fields hold placeholder strings (`Bearer svt-profiler-token-10r`)
#     and JWTs signed by the ephemeral keypair test/svt/profiler/keys makes at
#     setup time, which is gitignored, so nothing here is a credential any
#     system accepts. Analysed as source they read as leaked secrets and take
#     the security rating to E.
sonar.exclusions=**/*_test.go,test/svt/profiler/**/*.json

# Rule exclusions.
#   docker:S8431 asks for either a version tag or a digest on a base image, not
#   both. Renovate and Dependabot pin them as tag@digest on purpose: the digest
#   is what pins, and the tag is what makes an upgrade diff readable and lets
#   the bots group and describe updates. Reported upstream:
#   https://community.sonarsource.com/t/docker-s8431-makes-dependabot-upgrades-harder-to-read-and-limits-its-features/183693
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.e1.resourceKey=**/Dockerfile
