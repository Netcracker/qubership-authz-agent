sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Coverage exclusions: code a unit test cannot reach.
#   test/**   parity, integration and SVT suites (own Go modules), scripts, tools
sonar.coverage.exclusions=test/**

sonar.exclusions=**/*_test.go

# Rule exclusions.
#   docker:S8431 asks for either a version tag or a digest on a base image, not
#   both. Renovate and Dependabot pin them as tag@digest on purpose: the digest
#   is what pins, and the tag is what makes an upgrade diff readable and lets
#   the bots group and describe updates. Reported upstream:
#   https://community.sonarsource.com/t/docker-s8431-makes-dependabot-upgrades-harder-to-read-and-limits-its-features/183693
#
#   secrets:S8135 and secrets:S8217 read the load profiler's `opa bench`
#   fixtures as leaked credentials. They are neither: the bearer fields hold
#   placeholder strings spelled `Bearer svt-profiler-token-10r`, and the two
#   JWTs are signed by the throwaway keypair test/svt/profiler/keys mints at
#   setup time, which .gitignore keeps out of the repository. No system issues
#   or accepts any of them.
#
#   pythonsecurity:S2083 reports the matrix tools' `--output-file` reaching a
#   write. It does reach one, and both tools canonicalise the destination with
#   `os.path.realpath` and refuse anything outside test/svt before writing —
#   see `under_svt` in each. The taint analysis does not credit a sanitizer
#   behind a function call, so the finding survives the fix rather than
#   describing a gap. There is no privilege boundary here either: these are
#   developer tools that write where the person running them says.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.e1.resourceKey=**/Dockerfile
sonar.issue.ignore.multicriteria.e2.ruleKey=secrets:S8135
sonar.issue.ignore.multicriteria.e2.resourceKey=test/svt/profiler/**/*.json
sonar.issue.ignore.multicriteria.e3.ruleKey=secrets:S8217
sonar.issue.ignore.multicriteria.e3.resourceKey=test/svt/profiler/**/*.json
sonar.issue.ignore.multicriteria.e4.ruleKey=pythonsecurity:S2083
sonar.issue.ignore.multicriteria.e4.resourceKey=test/svt/common/tools/*.py
