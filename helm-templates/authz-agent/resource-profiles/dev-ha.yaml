# Dev-HA resource profile for authz-agent: the dev sizing with the autoscaler
# on, which keeps at least two Pods. See dev.yaml for where the numbers come
# from.
CPU_REQUEST: 350m
CPU_LIMIT: 400m
MEMORY_REQUEST: 364Mi
MEMORY_LIMIT: 700Mi
AUTHZ_AGENT_EPHEMERAL_STORAGE_REQUEST: 64Mi
AUTHZ_AGENT_EPHEMERAL_STORAGE_LIMIT: 512Mi
AUTHZ_DECISION_LOG_SIZE_LIMIT: 256Mi

HPA_ENABLED: true
HPA_MIN_REPLICAS: 2
HPA_MAX_REPLICAS: 5
HPA_AVG_CPU_UTILIZATION_TARGET_PERCENT: 75

# Only applied when AUTHZ_POLICY_ADMIN_ENABLED is true (authz-agent-ADR-0073).
AUTHZ_POLICY_ADMIN_CPU_REQUEST: 50m
AUTHZ_POLICY_ADMIN_CPU_LIMIT: 100m
AUTHZ_POLICY_ADMIN_MEM_REQUEST: 64Mi
AUTHZ_POLICY_ADMIN_MEM_LIMIT: 128Mi
