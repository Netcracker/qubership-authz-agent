{{/*
authz-agent-ADR-0077: the write-path authentication secret of the data API.

Generated once per install and preserved across upgrades (see the
authz-agent.opaAuthToken helper in _helpers.tpl). The agent reads the file
named by AUTHZ_OPA_AUTH_TOKEN_FILE and loads it as data.opa_auth_secret, and
system_authz.rego checks input.identity against it on all PUT/PATCH
/v1/data/** requests.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: '{{ include "authz-agent.serviceName" . }}-opa-auth'
  labels:
    {{- include "authz-agent.commonLabels" . | nindent 4 }}
type: Opaque
data:
  token: '{{ include "authz-agent.opaAuthToken" . | b64enc }}'
