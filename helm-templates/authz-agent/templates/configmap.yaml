# Trusted token providers live in their own ConfigMap because it is meant to
# be edited on a live installation: the agent re-reads the file and
# republishes `data.authn` without a Pod restart (authz-agent-ADR-0070).
#
# The Deployment mounts this ConfigMap as a directory and NOT with `subPath`:
# the kubelet never updates a subPath mount, so a subPath'd file would leave
# every edit invisible inside the container until the Pod was recreated.
apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ .Values.SERVICE_NAME }}-trusted-providers'
  labels:
    app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
    app.kubernetes.io/managed-by: '{{ .Values.MANAGED_BY }}'
    {{- if .Values.DEPLOYMENT_SESSION_ID }}
    deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
    {{- end }}
data:
  trusted-providers.json: |-
{{ (dict "providers" (include "authz-agent.trustedProviders" . | fromJsonArray)) | toPrettyJson | indent 4 }}
---
# ServiceAccount of the agent's Pod. With AUTHZ_M2M_TOKEN_SOURCE=token-file the
# kubelet projects its token for the netcracker audience into the Pod, and the
# agent sends that token as a Bearer credential on the policy pull and on its
# PIP calls. The ServiceAccount itself needs no RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: '{{ .Values.SERVICE_NAME }}'
  namespace: '{{ .Values.NAMESPACE }}'
  labels:
    app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
    app.kubernetes.io/managed-by: '{{ .Values.MANAGED_BY }}'
    {{- if .Values.DEPLOYMENT_SESSION_ID }}
    deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
    {{- end }}
