# Trusted token providers live in their own ConfigMap because it is meant to
# be edited on a live installation: the agent re-reads the file and
# republishes `data.authn` without a Pod restart (authz-agent-ADR-0070).
#
# The Deployment mounts this ConfigMap as a directory and NOT with `subPath`:
# the kubelet never updates a subPath mount, so a subPath'd file would leave
# every edit invisible inside the container until the Pod was recreated.
apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ include "authz-agent.serviceName" . }}-trusted-providers'
  labels:
    {{- include "authz-agent.commonLabels" . | nindent 4 }}
data:
  trusted-providers.json: |-
{{ (dict "providers" (include "authz-agent.trustedProviders" . | fromJsonArray)) | toPrettyJson | indent 4 }}
---
# ServiceAccount whose projected Kubernetes token the agent presents to the
# policy source. The token is sent as a Bearer credential on every request to
# access-control's v3 config API; access-control recognises it as an M2M
# principal via the `kubernetes.io` claim check in isM2M(). The ServiceAccount
# itself needs no RBAC — the projected token is sufficient.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: '{{ include "authz-agent.serviceName" . }}'
  labels:
    {{- include "authz-agent.commonLabels" . | nindent 4 }}
