{{- if .Values.MESH_ROUTES_ENABLED }}
# Service-mesh route registration (authz-agent-ADR-0074).
#
# Declarative CRs picked up by core-operator, which pushes them into the mesh
# control plane. This mirrors how access-control registers the same APIs — see
# its helm-templates/access-control/templates/routeconfiguration-mesh.yaml — so
# that a consumer calling the check API through a gateway reaches this agent by
# the same URL it used before.
#
# Only the access-control APIs this agent actually implements are registered.
# The whole management surface of access-control (/access/v1/policies,
# /access/v1/config, /template/v1/..., /api/v1/access-control/...) is absent
# here, because this agent does not serve it.
#
# Registering the same prefixes on the same gateway from two releases is a
# conflict: if access-control and authz-agent run in one namespace, only one of
# them can own these routes. Set MESH_ROUTES_ENABLED to false on whichever is
# not meant to serve them.
apiVersion: core.netcracker.com/v1
kind: Mesh
subKind: RouteConfiguration
metadata:
  name: '{{ include "authz-agent.serviceName" . }}-internal-routes'
  namespace: '{{ .Values.NAMESPACE }}'
  labels:
    {{- include "authz-agent.meshLabels" . | nindent 4 }}
spec:
  gateways:
    - internal-gateway-service
  # The agent serves plain HTTP only — it has no TLS listener, so there is no
  # tlsEndpoint to advertise. This must stay false until it grows one.
  tlsSupported: false
  virtualServices:
    - name: internal-gateway-service
      hosts: [ "*" ]
      routeConfiguration:
        {{- if .Values.DEPLOYMENT_VERSION }}
        version: '{{ .Values.DEPLOYMENT_VERSION }}'
        {{- end }}
        routes:
          - destination:
              cluster: '{{ .Values.SERVICE_NAME }}'
              endpoint: 'http://{{ include "authz-agent.serviceName" . }}:8080'
            rules:
              {{- include "authz-agent.meshCheckRules" . | nindent 14 }}
              # Record-level filtering is internal-only in access-control too:
              # it is absent from its public and private gateway registrations.
              - match:
                  prefix: /access/v1/check/filter
              - match:
                  prefix: /access/v2/check/filter
          # The canonical authorize API is rewritten to the data API on 8181,
          # a pure path rewrite to /v1/data/authorize with a 30s timeout, so
          # the gateway does that rewrite itself and the request reaches the
          # engine without a hop through the public surface. Byte-identity of
          # the two transports is what authz-agent-ADR-0062 locks in.
          #
          # A prefix, not an exact path — the mesh cannot express an exact match.
          # This rule originally used `match.path`, which the control plane
          # rejects with CORE-MESH-CP-4001 "has empty prefix field", taking the
          # WHOLE CR down with it: one bad rule and none of this gateway's routes
          # are registered. Supplying `path` and `prefix` together is accepted but
          # pointless — the control plane drops `path` and builds a prefix route
          # anyway, plus an auto-generated `/`-suffixed twin.
          #
          # The cost is that `/access/v1/authorize/<x>` rewrites to
          # `/v1/data/authorize/<x>` and returns a sub-document of the decision
          # rather than 404. That is a shape nobody asks for and OPA answers it
          # with an empty document, so it is noise rather than exposure.
          - destination:
              cluster: '{{ .Values.SERVICE_NAME }}-opa'
              endpoint: 'http://{{ include "authz-agent.serviceName" . }}:8181'
            rules:
              - match:
                  prefix: /access/v1/authorize
                prefixRewrite: /v1/data/authorize
                timeout: 30000
---
apiVersion: core.netcracker.com/v1
kind: Mesh
subKind: RouteConfiguration
metadata:
  name: '{{ include "authz-agent.serviceName" . }}-private-routes'
  namespace: '{{ .Values.NAMESPACE }}'
  labels:
    {{- include "authz-agent.meshLabels" . | nindent 4 }}
spec:
  gateways:
    - private-gateway-service
  tlsSupported: false
  virtualServices:
    - name: private-gateway-service
      hosts: [ "*" ]
      routeConfiguration:
        {{- if .Values.DEPLOYMENT_VERSION }}
        version: '{{ .Values.DEPLOYMENT_VERSION }}'
        {{- end }}
        routes:
          - destination:
              cluster: '{{ .Values.SERVICE_NAME }}'
              endpoint: 'http://{{ include "authz-agent.serviceName" . }}:8080'
            rules:
              {{- include "authz-agent.meshCheckRules" . | nindent 14 }}
---
apiVersion: core.netcracker.com/v1
kind: Mesh
subKind: RouteConfiguration
metadata:
  name: '{{ include "authz-agent.serviceName" . }}-public-routes'
  namespace: '{{ .Values.NAMESPACE }}'
  labels:
    {{- include "authz-agent.meshLabels" . | nindent 4 }}
spec:
  gateways:
    - public-gateway-service
  tlsSupported: false
  virtualServices:
    - name: public-gateway-service
      hosts: [ "*" ]
      routeConfiguration:
        {{- if .Values.DEPLOYMENT_VERSION }}
        version: '{{ .Values.DEPLOYMENT_VERSION }}'
        {{- end }}
        routes:
          - destination:
              cluster: '{{ .Values.SERVICE_NAME }}'
              endpoint: 'http://{{ include "authz-agent.serviceName" . }}:8080'
            rules:
              {{- include "authz-agent.meshCheckRules" . | nindent 14 }}
          # The canonical authorize API, same destination and rewrite as on the
          # internal gateway: the data API on 8181, whichever topology serves
          # it.
          #
          # This is the one route in this chart that puts a PUBLIC gateway in
          # front of that data API. It is deliberately narrow — the rewrite
          # pins the upstream path to `/v1/data/authorize`, so a caller cannot
          # reach another data document through it — but it is also
          # unauthenticated at the HTTP layer: the answer is 200 and the
          # decision itself carries the auth outcome, because no ext_authz sits
          # in front. A caller with no token gets a decision object saying so,
          # not a 401.
          #
          # Widening this rule, or changing the rewrite, exposes more of
          # `/v1/data` to the public internet. Treat it as security-relevant.
          - destination:
              cluster: '{{ .Values.SERVICE_NAME }}-opa'
              endpoint: 'http://{{ include "authz-agent.serviceName" . }}:8181'
            rules:
              - match:
                  prefix: /access/v1/authorize
                prefixRewrite: /v1/data/authorize
                timeout: 30000
{{- end }}
