{{- if .Values.MESH_ROUTES_ENABLED }}
# Service-mesh route registration (authz-agent-ADR-0074).
#
# Declarative CRs picked up by core-operator, which pushes them into the mesh
# control plane. This mirrors how access-control registers the same APIs — see
# its helm-templates/access-control/templates/routeconfiguration-mesh.yaml — so
# that a consumer calling the check API through a gateway reaches this agent by
# the same URL it used before.
#
# Only the access-control APIs this agent actually implements are registered.
# The whole management surface of access-control (/access/v1/policies,
# /access/v1/config, /template/v1/..., /api/v1/access-control/...) is absent
# here, because this agent does not serve it.
#
# Registering the same prefixes on the same gateway from two releases is a
# conflict: if access-control and authz-agent run in one namespace, only one of
# them can own these routes. Set MESH_ROUTES_ENABLED to false on whichever is
# not meant to serve them.
#
# Two labels on each CR are required by the platform: core-operator picks up
# only a CR labeled app.kubernetes.io/processed-by-operator: core-operator, and
# the deployer removes the routes with the release only where
# deployer.cleanup/allow is true. The labels are copied from the access-control
# chart, the reference implementation for these CRs.
apiVersion: core.netcracker.com/v1
kind: Mesh
subKind: RouteConfiguration
metadata:
  name: '{{ .Values.SERVICE_NAME }}-internal-routes'
  namespace: '{{ .Values.NAMESPACE }}'
  labels:
    app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
    app.kubernetes.io/managed-by: '{{ .Values.MANAGED_BY }}'
    app.kubernetes.io/processed-by-operator: 'core-operator'
    deployer.cleanup/allow: 'true'
    {{- if .Values.DEPLOYMENT_SESSION_ID }}
    deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
    {{- end }}
spec:
  gateways:
    - internal-gateway-service
  # The agent serves plain HTTP only — it has no TLS listener, so there is no
  # tlsEndpoint to advertise. This must stay false until it grows one.
  tlsSupported: false
  virtualServices:
    - name: internal-gateway-service
      hosts: [ "*" ]
      routeConfiguration:
        {{- if .Values.DEPLOYMENT_VERSION }}
        version: '{{ .Values.DEPLOYMENT_VERSION }}'
        {{- end }}
        routes:
          - destination:
              cluster: '{{ .Values.SERVICE_NAME }}'
              endpoint: 'http://{{ .Values.SERVICE_NAME }}:8080'
            rules:
              {{- include "authz-agent.meshCheckRules" . | nindent 14 }}
              # Record-level filtering is internal-only in access-control too:
              # it is absent from its public and private gateway registrations.
              - match:
                  prefix: /access/v1/check/filter
              - match:
                  prefix: /access/v2/check/filter
---
apiVersion: core.netcracker.com/v1
kind: Mesh
subKind: RouteConfiguration
metadata:
  name: '{{ .Values.SERVICE_NAME }}-private-routes'
  namespace: '{{ .Values.NAMESPACE }}'
  labels:
    app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
    app.kubernetes.io/managed-by: '{{ .Values.MANAGED_BY }}'
    app.kubernetes.io/processed-by-operator: 'core-operator'
    deployer.cleanup/allow: 'true'
    {{- if .Values.DEPLOYMENT_SESSION_ID }}
    deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
    {{- end }}
spec:
  gateways:
    - private-gateway-service
  tlsSupported: false
  virtualServices:
    - name: private-gateway-service
      hosts: [ "*" ]
      routeConfiguration:
        {{- if .Values.DEPLOYMENT_VERSION }}
        version: '{{ .Values.DEPLOYMENT_VERSION }}'
        {{- end }}
        routes:
          - destination:
              cluster: '{{ .Values.SERVICE_NAME }}'
              endpoint: 'http://{{ .Values.SERVICE_NAME }}:8080'
            rules:
              {{- include "authz-agent.meshCheckRules" . | nindent 14 }}
---
apiVersion: core.netcracker.com/v1
kind: Mesh
subKind: RouteConfiguration
metadata:
  name: '{{ .Values.SERVICE_NAME }}-public-routes'
  namespace: '{{ .Values.NAMESPACE }}'
  labels:
    app.kubernetes.io/name: '{{ .Values.SERVICE_NAME }}'
    app.kubernetes.io/part-of: '{{ .Values.APPLICATION_NAME }}'
    app.kubernetes.io/managed-by: '{{ .Values.MANAGED_BY }}'
    app.kubernetes.io/processed-by-operator: 'core-operator'
    deployer.cleanup/allow: 'true'
    {{- if .Values.DEPLOYMENT_SESSION_ID }}
    deployment.netcracker.com/sessionId: '{{ .Values.DEPLOYMENT_SESSION_ID }}'
    {{- end }}
spec:
  gateways:
    - public-gateway-service
  tlsSupported: false
  virtualServices:
    - name: public-gateway-service
      hosts: [ "*" ]
      routeConfiguration:
        {{- if .Values.DEPLOYMENT_VERSION }}
        version: '{{ .Values.DEPLOYMENT_VERSION }}'
        {{- end }}
        routes:
          - destination:
              cluster: '{{ .Values.SERVICE_NAME }}'
              endpoint: 'http://{{ .Values.SERVICE_NAME }}:8080'
            rules:
              {{- include "authz-agent.meshCheckRules" . | nindent 14 }}
{{- end }}
