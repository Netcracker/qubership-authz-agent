{{- if .Values.clientCredentials.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.clientCredentials.secretName }}
  labels:
    {{- include "authz-test-stand.labels" (dict "root" $ "name" .Values.clientCredentials.secretName "component" "client-credentials") | nindent 4 }}
type: Opaque
stringData:
  name: {{ .Values.clientCredentials.name | quote }}
  username: {{ required "clientCredentials.username is required" .Values.clientCredentials.username | quote }}
  password: {{ required "clientCredentials.password is required" .Values.clientCredentials.password | quote }}
{{- end }}
