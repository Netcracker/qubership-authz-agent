{
  "registry": "ghcr.io",
  "defaults": {
    "platforms": "linux/amd64,linux/arm64",
    "build_context": "."
  },
  "security": {
    "scan": true
  },
  "components": [
    {
      "name": "qubership-authz-agent",
      "dockerfile": "build/authz-agent/Dockerfile"
    },
    {
      "name": "qubership-authz-policy-admin",
      "dockerfile": "build/authz-policy-admin/Dockerfile"
    },
    {
      "name": "qubership-authz-pip-stub",
      "dockerfile": "test/integration/pipstub/Dockerfile",
      "build_context": "test/integration/pipstub"
    },
    {
      "name": "qubership-authz-parity-suite",
      "dockerfile": "test/parity/suite/Dockerfile",
      "build_context": "test/parity/suite"
    },
    {
      "name": "qubership-authz-agent-transfer",
      "dockerfile": "build/authz-agent-transfer/Dockerfile"
    }
  ]
}
