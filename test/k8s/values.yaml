# Chart values for the kind end-to-end harness in this directory. Not a
# deployment profile: what the platform normally injects comes from the
# harness Deployments instead, and they share one namespace with the chart, so
# the plain Service names below resolve.

# The images come from `make e2e-images`, which side-loads them into the kind
# node.
IMAGE_REPOSITORY: local/authz-agent
TAG: ci

# A kind cluster has no core-operator and no meshes.core.netcracker.com CRD,
# and no monitoring.coreos.com CRDs for the PodMonitor either.
MESH_ROUTES_ENABLED: false
MONITORING_ENABLED: false

# The harness Keycloak. The chart composes <base>/auth/realms/<realm> for each
# realm: cloud-common is the M2M realm the agent takes its token from,
# authz-test is where the suite's users and clients live. default and
# unregistered are tenant realms, which Keycloak names by an identifier: the
# agent resolves default through the tenant-manager emulator, which does not
# know unregistered, so the keys of that realm are never loaded.
IDENTITY_PROVIDER_URL: http://keycloak:8080
AUTHZ_IDP_REALMS:
  - cloud-common
  - authz-test
  - default
  - unregistered

# The tenant-manager emulator of the harness (test/k8s/tenant-manager.yaml).
AUTHZ_TENANT_MANAGER_URL: http://tenant-manager:8080

# The suite uploads policies and PIPs through the authz-policy-admin stub,
# installed from its own chart with policy-admin-values.yaml in this directory;
# the agent pulls them from the stub's Service.
AUTHZ_PAP_CLIENT_SOURCE_URL: http://authz-policy-admin:18090
# The suite waits one pull interval plus two seconds after each upload.
AUTHZ_PAP_CLIENT_PULL_INTERVAL: 2

# The entitlements stub of the harness; the suite pins its responses.
AUTHZ_ENTITLEMENTS_URL: http://entitlements-mock:8090
