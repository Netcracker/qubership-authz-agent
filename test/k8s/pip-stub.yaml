# pip-stub for the kind end-to-end run: the Policy Information Point that the
# uploaded PIP definitions call, plus the control surface the suite pins
# responses through. The Service name is part of the test data
# (PIP_STUB_INTERNAL_URL defaults to http://pip-stub:8090), so keep it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pip-stub
  labels:
    app: pip-stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pip-stub
  template:
    metadata:
      labels:
        app: pip-stub
    spec:
      containers:
        - name: pip-stub
          image: local/pip-stub:ci
          imagePullPolicy: Never
          env:
            - name: PIP_STUB_PORT
              value: "8090"
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /pip-stub/calls
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: pip-stub
spec:
  selector:
    app: pip-stub
  ports:
    - name: http
      port: 8090
      targetPort: http
