# The single service's own public listener, for running the suites against
# it while the chart still fronts the Pod with Envoy. Installed with
# E2E_HELM_ARGS='--set OPA_IMAGE=local/authz-agent:ci', the service in the
# OPA container serves the legacy API on port 8280; this Service exposes it
# under the port the suites expect. Select it with
# E2E_BASE_URL=http://authz-agent-direct:8080 (runtime suite) and
# PARITY_AC_BASE_URL=http://authz-agent-direct:8080 (parity replay).
apiVersion: v1
kind: Service
metadata:
  name: authz-agent-direct
spec:
  type: ClusterIP
  selector:
    name: authz-agent
  ports:
    - name: web
      port: 8080
      targetPort: 8280
      protocol: TCP
