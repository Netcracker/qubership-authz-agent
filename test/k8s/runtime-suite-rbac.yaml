# Access the runtime suite needs inside the cluster: restarting the OPA
# container on its own. The suite adds an ephemeral container to the agent Pod
# that signals the OPA process, then reads the Pod until the kubelet reports a
# higher restartCount. Nothing else in the suite touches the API server.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runtime-suite
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runtime-suite
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/ephemeralcontainers"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runtime-suite
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runtime-suite
subjects:
  - kind: ServiceAccount
    name: runtime-suite
