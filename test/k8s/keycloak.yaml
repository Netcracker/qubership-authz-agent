# Keycloak for the kind end-to-end run (`make e2e-harness`).
#
# Same start-dev settings as the Compose runtime stack. The realm imports come
# from test/integration/runtime/authn/keycloak/ and are packed into the
# keycloak-realms ConfigMap by the script, so this file does not duplicate
# them. KC_HOSTNAME must match the in-cluster Service name: the issuer and the
# JWKS URI in the discovery document derive from it, and the agent fetches them
# from inside the cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.3.5
          args: ["start-dev", "--import-realm", "--health-enabled=true"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: kcadmin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: kcadmin
            - name: KC_HOSTNAME
              value: http://keycloak:8080/auth
            - name: KC_HTTP_RELATIVE_PATH
              value: /auth
            - name: JAVA_OPTS_APPEND
              value: -Dkeycloak.migration.strategy=OVERWRITE_EXISTING
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          # KC_HTTP_RELATIVE_PATH prefixes the management endpoints too, so the
          # health path carries /auth. Cold start with two realm imports takes
          # about a minute; the startup probe allows five.
          startupProbe:
            httpGet:
              path: /auth/health/ready
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /auth/health/ready
              port: management
            periodSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: realms
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realms
          configMap:
            name: keycloak-realms
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 9000
      targetPort: management
