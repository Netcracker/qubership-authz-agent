# entitlements-mock for the parity replay: a second pip-stub instance that
# serves the entitlements V3 endpoint on port 8080, the port the Compose stack
# uses for it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: entitlements-mock
  labels:
    app: entitlements-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: entitlements-mock
  template:
    metadata:
      labels:
        app: entitlements-mock
    spec:
      # The stub calls no Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: entitlements-mock
          image: local/pip-stub:ci
          imagePullPolicy: Never
          env:
            - name: PIP_STUB_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /pip-stub/calls
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
              ephemeral-storage: 64Mi
            limits:
              memory: 64Mi
              ephemeral-storage: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: entitlements-mock
spec:
  selector:
    app: entitlements-mock
  ports:
    - name: http
      port: 8080
      targetPort: http
