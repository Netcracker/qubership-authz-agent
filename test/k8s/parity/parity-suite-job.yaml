# Runs the parity replay suite inside the cluster against the chart that
# `make parity-install` installed. The image comes from
# test/parity/suite/Dockerfile and is side-loaded into kind. Every target is
# addressed by Service name; the PARITY_* block mirrors
# test/parity/scripts/run-parity-suite.sh.
apiVersion: batch/v1
kind: Job
metadata:
  name: parity-suite
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: parity-suite
    spec:
      restartPolicy: Never
      # The suite calls no Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: parity-suite
          image: local/authz-parity-suite:ci
          imagePullPolicy: Never
          # The image inherits the Qubership base entrypoint, which execs its
          # arguments, so the binary is the first argument.
          args:
            - ./parity.test
            - -test.v
            - -test.timeout
            - 600s
            - -test.run
            - ^TestParitySuite$
          env:
            - name: PARITY_PROFILE
              value: authz-agent
            - name: PARITY_AC_BASE_URL
              value: http://authz-agent:8080
            - name: PARITY_IDP_BASE_URL
              value: http://idp:8080/auth/realms/parity
            - name: PARITY_AUTHZ_POLICY_ADMIN_BASE_URL
              value: http://authz-agent-authz-policy-admin:18090
            - name: PARITY_PIP_MOCK_CONTROL_URL
              value: http://pip-mock:8090
            - name: PARITY_EA_MOCK_CONTROL_URL
              value: http://entitlements-mock:8080
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              memory: 256Mi
              ephemeral-storage: 256Mi
