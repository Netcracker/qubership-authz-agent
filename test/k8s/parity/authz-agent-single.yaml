# The single service on its own in the parity namespace; see
# test/k8s/authz-agent-single.yaml, with `make parity-harness` creating the
# client-credentials Secret here. The parity values configure the parity
# realm as an explicit, required trusted provider, bootstrapped in strict
# mode, and the entitlements mock on port 8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authz-agent-single
spec:
  replicas: 1
  selector:
    matchLabels:
      name: authz-agent-single
  template:
    metadata:
      labels:
        name: authz-agent-single
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      volumes:
        - name: trusted-providers
          configMap:
            name: authz-agent-trusted-providers
        - name: client-credentials
          secret:
            secretName: authz-agent-client-credentials
        - name: opa-auth-token
          secret:
            secretName: authz-agent-opa-auth
        - name: decision-logs
          emptyDir: {}
      containers:
        - name: opa
          image: local/authz-agent:ci
          imagePullPolicy: Never
          ports:
            - name: web
              containerPort: 8080
            - name: opa
              containerPort: 8181
          env:
            - name: AUTHZ_PUBLIC_ADDR
              value: 0.0.0.0:8080
            - name: AUTHZ_HTTP_ADDR
              value: 0.0.0.0:8181
            - name: AUTHZ_DATA_API_AUTHORIZATION
              value: "true"
            - name: AUTHZ_OPA_AUTH_TOKEN_FILE
              value: /etc/authz/opa-auth/token
            - name: AUTHZ_TRUSTED_PROVIDERS_FILE
              value: /etc/authz/trusted-providers.json
            - name: AUTHZ_JWKS_BOOTSTRAP_REQUIRED
              value: "true"
            - name: AUTHZ_JWKS_HTTP_TIMEOUT
              value: "2"
            - name: AUTHZ_JWKS_HTTP_RETRIES
              value: "20"
            - name: AUTHZ_TENANT_MANAGER_URL
              value: ""
            - name: AUTHZ_PAP_CLIENT_SOURCE_URL
              value: http://authz-agent-authz-policy-admin:18090
            - name: AUTHZ_PAP_CLIENT_PULL_INTERVAL
              value: "1"
            - name: AUTHZ_M2M_TOKEN_URL
              value: http://idp:8080/auth/realms/cloud-common/protocol/openid-connect/token
            - name: AUTHZ_M2M_CLIENT_ID_FILE
              value: /etc/secret/username
            - name: AUTHZ_M2M_CLIENT_SECRET_FILE
              value: /etc/secret/password
            - name: AUTHZ_ENTITLEMENTS_URL
              value: http://entitlements-mock:8080
            - name: AUTHZ_ENTITLEMENTS_HTTP_TIMEOUT
              value: "2"
            - name: AUTHZ_ENTITLEMENTS_HTTP_RETRIES
              value: "3"
            - name: AUTHZ_DECISION_LOG_FILE
              value: /var/log/authz/decision-logs.jsonl
            - name: AUTHZ_DECISION_LOG_HEADERS
              value: x-request-id,x-authz-original-path
          volumeMounts:
            - name: trusted-providers
              mountPath: /etc/authz
              readOnly: true
            - name: client-credentials
              mountPath: /etc/secret
              readOnly: true
            - name: opa-auth-token
              mountPath: /etc/authz/opa-auth
              readOnly: true
            - name: decision-logs
              mountPath: /var/log/authz
          readinessProbe:
            httpGet:
              path: /ready
              port: 8181
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8181
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: authz-agent-single
spec:
  type: ClusterIP
  selector:
    name: authz-agent-single
  ports:
    - name: web
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: opa
      port: 8181
      targetPort: 8181
      protocol: TCP
