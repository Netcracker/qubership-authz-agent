# pip-mock for the parity replay: the PIP stub with the request-args rule set
# from test/integration/pipstub/config/, packed into the pip-mock-config
# ConfigMap by the Makefile. The suite pins responses through its control API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pip-mock
  labels:
    app: pip-mock
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pip-mock
  template:
    metadata:
      labels:
        app: pip-mock
    spec:
      # The stub calls no Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: pip-mock
          image: local/pip-stub:ci
          imagePullPolicy: Never
          env:
            - name: PIP_STUB_PORT
              value: "8090"
            - name: PIP_STUB_CONFIG
              value: /etc/pip-stub/requestargs.responses.yaml
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /pip-stub/calls
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
              ephemeral-storage: 64Mi
            limits:
              memory: 64Mi
              ephemeral-storage: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/pip-stub
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: pip-mock-config
---
apiVersion: v1
kind: Service
metadata:
  name: pip-mock
spec:
  selector:
    app: pip-mock
  ports:
    - name: http
      port: 8090
      targetPort: http
