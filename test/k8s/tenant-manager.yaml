# tenant-manager emulator for the kind end-to-end run. The agent asks it for
# the identifier of a tenant realm whose name the chart configures, and the
# harness Keycloak names that realm by the identifier, as identity-provider
# does. `unregistered` is left out on purpose: its realm exists in Keycloak,
# and the suite checks that a token from it is refused.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-manager
  labels:
    app: tenant-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tenant-manager
  template:
    metadata:
      labels:
        app: tenant-manager
    spec:
      # The emulator calls no Kubernetes API.
      automountServiceAccountToken: false
      containers:
        - name: tenant-manager
          image: local/tenant-manager:ci
          imagePullPolicy: Never
          env:
            # The realm in test/k8s/authn/tenant-default-realm.json.
            - name: TENANT_MANAGER_TENANTS
              value: default=6f1c2a9e-3b4d-4e8f-9a1b-2c3d4e5f6a7b
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
              ephemeral-storage: 64Mi
            limits:
              memory: 64Mi
              ephemeral-storage: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-manager
spec:
  selector:
    app: tenant-manager
  ports:
    - name: http
      port: 8080
      targetPort: http
