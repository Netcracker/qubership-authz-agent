# Runs the Testify runtime suite inside the cluster against the chart that
# `make e2e-install` installed. Every target is addressed by Service
# name, so no port has to leave the cluster. The image comes from
# test/integration/testify/Dockerfile and is side-loaded into kind.
#
# RUNTIME_SUITE_RUN selects the whole suite: every group works against the
# chart as installed, and FULL_RUNTIME_SUITE turns on the two coverage checks
# that only make sense for a full run.
apiVersion: batch/v1
kind: Job
metadata:
  name: runtime-suite
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: runtime-suite
    spec:
      restartPolicy: Never
      serviceAccountName: runtime-suite
      # The token is mounted explicitly below, for the one thing the suite
      # asks the API server for: restarting the OPA container.
      automountServiceAccountToken: false
      containers:
        - name: runtime-suite
          image: local/authz-runtime-suite:ci
          imagePullPolicy: Never
          # The image inherits the Qubership base entrypoint, which execs its
          # arguments, so the binary is the first argument rather than the
          # image's CMD.
          args:
            - ./runtime.test
            - -test.v
            - -test.timeout
            - 600s
            - -test.run
            - $(RUNTIME_SUITE_RUN)
          env:
            - name: RUNTIME_SUITE_RUN
              value: "^TestRuntimeSuite$"
            - name: FULL_RUNTIME_SUITE
              value: "true"
            # The chart runs token-fetcher by default, so the m2m_keycloak
            # steps are real here rather than skipped.
            - name: M2M_KEYCLOAK_PROFILE
              value: "true"
            # The stack driver (test/integration/testify/stack.go) restarts
            # OPA through the API server: it needs the namespace, the agent
            # Pod's label, and an image with `kill` for the ephemeral container.
            - name: RUNTIME_PROFILE
              value: kubernetes
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: K8S_AGENT_SELECTOR
              value: name=authz-agent
            - name: K8S_DEBUG_IMAGE
              value: local/authz-agent-pap-client:ci
            - name: BASE_URL
              value: http://authz-agent:8080
            - name: OPA_DIRECT_URL
              value: http://authz-agent:8181
            - name: AUTHZ_POLICY_ADMIN_URL
              value: http://authz-agent-authz-policy-admin:18090
            - name: AUTHZ_PAP_CLIENT_PULL_INTERVAL
              value: "2"
            - name: KC_BASE_URL
              value: http://keycloak:8080/auth/realms/authz-test
            - name: KC_CLIENT_ID
              value: authz-agent
            - name: KC_CLIENT_SECRET
              value: authz-agent-secret
            - name: KC_EXPIRED_CLIENT_ID
              value: authz-agent-expired
            - name: KC_EXPIRED_CLIENT_SECRET
              value: authz-agent-expired-secret
            - name: KC_USERNAME
              value: order-reader
            - name: KC_ADMIN_USERNAME
              value: admin
            - name: KC_PASSWORD
              value: password
            - name: KC_TOKEN_SCOPE
              value: openid
            - name: KC_EXPIRED_WAIT_SECONDS
              value: "6"
            - name: PIP_STUB_URL
              value: http://pip-stub:8090
            - name: PIP_STUB_INTERNAL_URL
              value: http://pip-stub:8090
            - name: ENTITLEMENTS_MOCK_URL
              value: http://entitlements-mock:8090
            # The chart generates this token per install; the opa_lockdown
            # steps read it from the same Secret pap-client uses.
            - name: OPA_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: authz-agent-opa-auth
                  key: token
          volumeMounts:
            - name: kube-api
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              memory: 256Mi
              ephemeral-storage: 256Mi
      volumes:
        # A short-lived token for the runtime-suite ServiceAccount plus the
        # cluster CA, at the path the driver reads.
        - name: kube-api
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
