name: parity-authz

services:
  postgres:
    image: postgres:16-alpine
    container_name: parity-authz-postgres
    environment:
      POSTGRES_USER: parity_superuser
      POSTGRES_PASSWORD: parity_superuser
      POSTGRES_DB: postgres
      PARITY_AC_DB: access_control
      PARITY_AC_USER: access_control
      PARITY_AC_PASSWORD: access_control
      PARITY_IDP_DB: identity_provider
      PARITY_IDP_USER: identity_provider
      PARITY_IDP_PASSWORD: identity_provider
    volumes:
      - parity-authz-pg-data:/var/lib/postgresql/data
      - ./pg-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parity_superuser -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - parity-authz

  idp:
    # Vanilla Keycloak 26.3.5 — matching the version the internal identity-provider
    # fork was based on. The two realm files (cloud-common-realm.json and
    # parity-realm.json) use only standard Keycloak protocol mappers
    # (oidc-audience-mapper, oidc-usermodel-attribute-mapper) so no custom
    # SPI extensions are needed. The internal Keycloak fork
    # carries no behaviour load-bearing for the parity replay; vanilla KC serves
    # the same OIDC endpoints that the suite calls (client_credentials + password
    # grants against /auth/realms/parity/protocol/openid-connect/token).
    #
    # KC_HTTP_RELATIVE_PATH=/auth: Keycloak dropped the /auth prefix in v17 and
    # serves realms at root; the parity stack is wired around /auth/realms/parity
    # throughout (trusted-providers.json, PARITY_IDP_BASE_URL default, the suite
    # token factory). Set the standard env var to restore it. Without --optimized,
    # KC runs its augmentation build at startup (adds ~60 s); the healthcheck's
    # 60 s start_period plus 30 retries covers it.
    image: ${PARITY_IDP_IMAGE:-quay.io/keycloak/keycloak:26.3.5}
    container_name: parity-authz-idp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: identity_provider
      KC_DB_USERNAME: identity_provider
      KC_DB_PASSWORD: identity_provider
      KC_HOSTNAME: http://idp:8080/auth
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_BOOTSTRAP_ADMIN_USERNAME: kcbootstrap
      KC_BOOTSTRAP_ADMIN_PASSWORD: KcBootstrap1!@#
      KC_LOG_LEVEL: "info"
      # Enable Keycloak's management health endpoint on port 9000.
      # The quay.io/keycloak/keycloak image is UBI9-minimal and ships without
      # curl or wget; the healthcheck below uses bash's /dev/tcp built-in instead.
      KC_HEALTH_ENABLED: "true"
    entrypoint: ["/opt/keycloak/bin/kc.sh"]
    command:
      - start
      # No --optimized: KC_HTTP_RELATIVE_PATH is a build-time option; dropping
      # --optimized makes Keycloak run its augmentation build at startup so the
      # option is applied without a pre-built image. Costs ~60 s cold.
      - --hostname-strict=false
      - --http-enabled=true
      - --import-realm
      - --cache=local
    volumes:
      - ./idp-seed/cloud-common-realm.json:/opt/keycloak/data/import/cloud-common-realm.json:ro
      - ./idp-seed/parity-realm.json:/opt/keycloak/data/import/parity-realm.json:ro
    ports:
      - "${PARITY_AUTHZ_IDP_PORT:-25558}:8080"
    healthcheck:
      # quay.io/keycloak/keycloak is UBI9-minimal with no curl/wget; use bash
      # /dev/tcp to check the Keycloak management health endpoint (port 9000).
      # KC_HEALTH_ENABLED=true must be set for port 9000 to respond.
      # KC_HTTP_RELATIVE_PATH=/auth prepends /auth to ALL endpoint paths,
      # including the management health endpoint: /auth/health/ready not
      # /health/ready. The full HTTP/1.0 exchange avoids blocking on keep-alive.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 2>/dev/null && printf 'GET /auth/health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks:
      - parity-authz

  pip-mock:
    image: ${PARITY_PIPSTUB_IMAGE:-pip-stub:local}
    container_name: parity-authz-pip-mock
    environment:
      PIP_STUB_PORT: "8090"
      # ADR-0066..0069 request-args cases: the static YAML rule engine, matched on
      # request content. Its rules are namespaced under /api/v1/pip/ra/* so they
      # never shadow the PUT /pip-stub/configure routes existing fixtures pin.
      PIP_STUB_CONFIG: /etc/pip-stub/requestargs.responses.yaml
    volumes:
      - ../../../test/integration/pipstub/config/requestargs.responses.yaml:/etc/pip-stub/requestargs.responses.yaml:ro
    ports:
      - "${PARITY_AUTHZ_PIP_PORT:-28191}:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8090/pip-stub/calls || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - parity-authz

  entitlements-mock:
    image: ${PARITY_PIPSTUB_IMAGE:-pip-stub:local}
    container_name: parity-authz-entitlements-mock
    environment:
      PIP_STUB_PORT: "8080"
    ports:
      - "${PARITY_AUTHZ_EA_PORT:-28192}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/pip-stub/calls || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - parity-authz

  # authz-policy-admin: the policy source the parity seeder writes to.
  #
  # authz-agent has no policy upload endpoint any more — authz-agent-ADR-0071
  # retired `PUT /internal/v1/policies` in favour of a pull loop against
  # access-control's v3 config API. The parity seeder was repointed at an
  # authz-policy-admin at the same time (suite/config.go, ACStubBaseURL, default
  # http://localhost:28093) but this compose was never given the service, so
  # SetupSuite failed at its first wipe with "connection refused" and the suite
  # reported 0/0 cases.
  #
  # The stub serves both sides of that contract: it accepts the seeder's
  # `PUT /access/v1/simplifiedPolicies/...` (unauthenticated, as the seeder
  # sends no token) and serves `GET /access/v3/config/...` to the agent's
  # PolicyPuller (which does require a non-empty Authorization).
  authz-policy-admin:
    image: ${PARITY_AUTHZ_POLICY_ADMIN_IMAGE:-authz-policy-admin:local}
    container_name: parity-authz-authz-policy-admin
    environment:
      AUTHZ_POLICY_ADMIN_PORT: "18090"
    ports:
      - "${PARITY_AUTHZ_POLICY_ADMIN_PORT:-28093}:18090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:18090/authz-policy-admin/hash || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s
    networks:
      - parity-authz

  # ── split topology: opa-bootstrap + opa + pap-client ────────────────────

  # opa-bootstrap: one-shot JWKS bootstrap before OPA starts.
  opa-bootstrap:
    image: ${PARITY_PAP_CLIENT_IMAGE:-authz-pap-client:local}
    container_name: parity-authz-opa-bootstrap
    command: ["pap-client", "bootstrap"]
    depends_on:
      idp:
        condition: service_healthy
    environment:
      AUTHZ_TRUSTED_PROVIDERS_FILE: /etc/authz/trusted-providers.json
      AUTHZ_JWKS_HTTP_TIMEOUT: 2
      AUTHZ_JWKS_HTTP_RETRIES: 20
      AUTHZ_OPA_AUTH_TOKEN_FILE: /etc/authz/opa-auth/token
    volumes:
      - ./authz-agent-config/trusted-providers.json:/etc/authz/trusted-providers.json:ro
      - ./authz-agent-config/opa-auth/token:/etc/authz/opa-auth/token:ro
      - parity-authz-opa-data:/etc/opa/data
      - parity-authz-run:/var/run/authz
    networks:
      - parity-authz

  # opa: vanilla upstream OPA. Reads data from parity-authz-opa-data volume.
  # Alias "opa" on parity-authz network is implied by the service name; envoy
  # routes to opa:8181.
  opa:
    image: openpolicyagent/opa@sha256:b326c40be4255ff568350542d546f70950b8d321fbbc59e604918230c0520b16
    # Match the uid the pap-client image runs as: bootstrap writes
    # opa-auth-secret.json with mode 0600 into the shared opa-data volume,
    # and OPA has to be able to read it.
    user: "10001:0"
    container_name: parity-authz-opa
    depends_on:
      opa-bootstrap:
        condition: service_completed_successfully
    ports:
      # pap-client (below) shares this container's network namespace via
      # network_mode: "service:opa", so publishing port 8182 here exposes
      # pap-client's HTTP server to the host.
      - "${PARITY_AUTHZ_ADMIN_PORT:-28182}:8182"
    command:
      - run
      - --server
      - --addr
      - "0.0.0.0:8181"
      - --ignore=..*
      - --authorization=basic
      - --authentication=token
      - --config-file
      - /etc/opa/opa-config.yaml
      - /etc/opa/policies
      - /etc/opa/data
    healthcheck:
      # OPA v1.x removed the `opa health` subcommand; use eval + http.send.
      test: ["CMD", "/opa", "eval", "--fail", "http.send({\"method\":\"GET\",\"url\":\"http://localhost:8181/health\"}).status_code == 200"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - parity-authz-opa-data:/etc/opa/data:ro
      - ../../../test/.runtime-configs/opa/opa-config.yaml:/etc/opa/opa-config.yaml:ro
      - ../../../charts/authz-agent/files/opa/policies:/etc/opa/policies:ro
    networks:
      - parity-authz

  # pap-client: Policy Administration Point client.
  # Shares OPA's network namespace so it reaches OPA on 127.0.0.1:8181.
  pap-client:
    image: ${PARITY_PAP_CLIENT_IMAGE:-authz-pap-client:local}
    container_name: parity-authz-pap-client
    network_mode: "service:opa"
    depends_on:
      opa:
        condition: service_healthy
      opa-bootstrap:
        condition: service_completed_successfully
      pip-mock:
        condition: service_healthy
      entitlements-mock:
        condition: service_healthy
      authz-policy-admin:
        condition: service_healthy
    environment:
      AUTHZ_PAP_CLIENT_ADDR: "0.0.0.0:8182"
      AUTHZ_TRUSTED_PROVIDERS_FILE: /etc/authz/trusted-providers.json
      AUTHZ_JWKS_HTTP_TIMEOUT: 2
      AUTHZ_JWKS_HTTP_RETRIES: 20
      # Pull policies from the authz-policy-admin the seeder writes to (ADR-0071).
      # The interval is 1 s rather than the 30 s default because the suite
      # seeds and asserts in sequence: this is the whole propagation budget
      # between a seeder PUT and the first assertion that depends on it.
      # PARITY_PULL_SETTLE_SECONDS in the Go suite must stay >= this value.
      AUTHZ_PAP_CLIENT_SOURCE_URL: http://authz-policy-admin:18090
      AUTHZ_PAP_CLIENT_PULL_INTERVAL: 1
      AUTHZ_PAP_CLIENT_TOKEN_FILE: /etc/authz/ac-pull-token
      # OPA's Data API is closed to unauthenticated writes (ADR-0077).
      AUTHZ_OPA_AUTH_TOKEN_FILE: /etc/authz/opa-auth/token
      # ADR-0054 / D-AG-11 / D-AG-17: the container-pinned entitlements PIP
      # points at the parity-authz entitlements-mock on the same network.
      # The resolver composes ${URL}/api/v3/user-entitlements/user/{userId}
      # at request time per D-AG-13. Timeout/retries mirror the existing
      # AUTHZ_JWKS_HTTP_* block so the parity stack holds long enough for
      # the first cold request to succeed.
      AUTHZ_ENTITLEMENTS_URL: http://entitlements-mock:8080
      AUTHZ_ENTITLEMENTS_HTTP_TIMEOUT: 2
      AUTHZ_ENTITLEMENTS_HTTP_RETRIES: 3
    healthcheck:
      test: ["CMD", "pap-client", "healthcheck"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 15s
    volumes:
      - ./authz-agent-config/trusted-providers.json:/etc/authz/trusted-providers.json:ro
      - ./authz-agent-config/ac-pull-token:/etc/authz/ac-pull-token:ro
      - ./authz-agent-config/opa-auth/token:/etc/authz/opa-auth/token:ro
      - parity-authz-opa-data:/etc/opa/data
      - parity-authz-run:/var/run/authz

  decision-log-collector:
    image: ${PARITY_DECISION_LOG_COLLECTOR_IMAGE:-decision-log-collector:local}
    container_name: parity-authz-decision-log-collector
    depends_on:
      pap-client:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8183/healthz || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s
    networks:
      - parity-authz

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    container_name: parity-authz-envoy
    depends_on:
      pap-client:
        condition: service_healthy
      decision-log-collector:
        condition: service_healthy
    ports:
      - "${PARITY_AUTHZ_PORT:-28100}:8080"
    volumes:
      - ../../../test/.runtime-configs/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ../../../configs/envoy/lua:/etc/envoy/lua:ro
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info", "--service-cluster", "authz-agent"]
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/9901'"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      - parity-authz

networks:
  parity-authz:
    name: parity-authz
    driver: bridge

volumes:
  parity-authz-pg-data:
    name: parity-authz-pg-data
  # opa-data: shared between opa-bootstrap (write), opa (read), and
  # pap-client (write). Covers the full /etc/opa/data directory.
  parity-authz-opa-data:
    name: parity-authz-opa-data
  # authz-run: shared between opa-bootstrap (writes bootstrap-status.json)
  # and pap-client (reads bootstrap-status.json, writes pull-status.json).
  parity-authz-run:
    name: parity-authz-run
