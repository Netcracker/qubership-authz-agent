rules:
  archived-uses:
    ignore:
      # contributor-assistant/github-action is archived upstream but is the
      # organisation-standard CLA flow shipped by the repository template.
      - cla.yaml
  dangerous-triggers:
    ignore:
      - cla.yaml
      - pr-assigner.yml
      # Needs issue_comment to filter comments; the job neither checks out code
      # nor runs a shell. zizmor cannot scope this to one trigger: an inline
      # comment covers the whole on: block, and file:line breaks when lines move.
      - profanity-filter.yaml
  secrets-outside-env:
    disable: true
