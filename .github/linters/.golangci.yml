version: "2"
run:
  timeout: 10m
linters:
  enable:
    - gocritic
    - nolintlint
  settings:
    gocritic:
      disable-all: true
      enabled-checks:
        - ruleguard
      settings:
        ruleguard:
          rules: ${config-path}/../../tools/ruleguard/rules.go
          failOn: all
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
