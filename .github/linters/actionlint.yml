# GitHub-hosted runner labels that actionlint 1.7.12, and the older one in
# Super-Linter v9.0.0, do not know. actionlint reads this list as labels of
# self-hosted runners.
self-hosted-runner:
  labels:
    - ubuntu-26.04
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      - 'shellcheck reported issue in this script: SC2086:info.+'
      - 'shellcheck reported issue in this script: SC2002:style.+'
  actions/**/*.{yml,yaml}:
    ignore:
      - 'shellcheck reported issue in this script: SC2086:info.+'
      - 'shellcheck reported issue in this script: SC2002:style.+'
