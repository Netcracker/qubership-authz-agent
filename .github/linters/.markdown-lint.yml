---
# markdownlint configuration.
# The filename .markdown-lint.yml is what super-linter's MARKDOWN_CONFIG_FILE
# defaults to — a config under any other name is silently ignored in CI.
# The local pre-commit hook and `make lint` read this same file.
default: true
MD004:
  style: consistent
MD007:
  indent: 2
MD013:
  line_length: 400
  code_blocks: false
  tables: false
MD024:
  siblings_only: true
MD029:
  style: one_or_ordered
MD033:
  allowed_elements: [img, br, a, p]
MD046:
  style: fenced
