---
# Findings of `trivy config` on the rendered product charts that the charts
# accept on purpose. test/scripts/lint-images-and-charts.sh reads this file.
misconfigurations:
  - id: KSV-0020
    statement: >-
      runAsUser is left unset on purpose: on OpenShift the restricted SCC
      assigns a uid from the namespace range and rejects a pinned one, and on
      Kubernetes the container runs as the image user 10001. runAsNonRoot is
      set on both Pods.
  - id: KSV-0021
    paths:
      - authz-agent.yaml
    statement: >-
      The agent sets no runAsGroup for the same reason as KSV-0020; it reads
      only world-readable mounts, so its group does not matter.
  - id: KSV-0110
    statement: >-
      The charts render into whatever namespace `helm install --namespace`
      names; a namespace in the template would override that choice.
  - id: KSV-0125
    statement: >-
      The images come from ghcr.io/netcracker by default and from local/ on
      the kind harness; neither is on trivy's built-in list of trusted
      registries, and the platform overrides the registry per installation.
