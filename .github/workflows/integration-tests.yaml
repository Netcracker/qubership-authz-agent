---
# Integration tests for qubership-authz-agent.
#
# Everything the Build workflow (go-build.yaml) does not cover:
#   rego                 Rego policy tests with the OPA CLI
#   chart                helm lint plus the chart-render assertions
#   integration-compile  go vet with -tags integration, so a broken integration
#                        test file fails here instead of after a cluster boot
#   jsonpath-jayway      internal/jsonpath against Jayway JsonPath on the JVM,
#                        over the package's cases and the json-path-comparison
#                        queries (Makefile test-jayway)
#   kind-e2e             the Helm chart installed on a kind cluster and the
#                        runtime suite run against it (Makefile e2e-* targets,
#                        see test/k8s/README.md)
#   kind-parity          the chart on kind again, in its own namespace, with the
#                        parity replay suite against it (Makefile parity-* targets)
#   ci-gate              one status check for branch protection
#
# No paths filter on purpose: ci-gate is meant to be a required check, and a
# workflow skipped by a filter leaves a required check pending.

name: Integration

run-name: "Ref: ${{ github.ref_name }}. On ${{ github.event_name }}"

on:
  push:
    branches:
      - main
      - 'lts/**'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rego:
    name: Rego policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OPA
        run: bash test/scripts/install-opa.sh

      - name: Run policy tests
        run: bash test/scripts/test-opa.sh

  chart:
    name: Chart lint and render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Lint the charts
        run: |
          helm lint helm-templates/authz-agent -f helm-templates/authz-agent/resource-profiles/dev.yaml -f test/k8s/values.yaml
          helm lint helm-templates/authz-policy-admin -f helm-templates/authz-policy-admin/resource-profiles/dev.yaml -f test/k8s/policy-admin-values.yaml

      - name: Render assertions
        run: bash test/scripts/test-chart-render.sh

  integration-compile:
    name: Vet tagged suites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            test/integration/testify/go.sum
            test/parity/suite/go.sum

      - name: Vet the runtime suite
        working-directory: test/integration/testify
        run: go vet -tags integration ./...

      - name: Vet the parity suite
        working-directory: test/parity/suite
        run: go vet -tags integration ./...

  jsonpath-jayway:
    name: jsonPath against Jayway
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The queries are under GPL-3.0, so the job reads them from their own
      # repository, pinned to one commit, and this repository holds none of them.
      - name: Checkout json-path-comparison
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cburgmer/json-path-comparison
          ref: e090dae440ac22a5da2a33a74ea65c351124fe97
          path: json-path-comparison
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: internal/jsonpath/testdata/jayway/pom.xml

      - name: Compare with Jayway
        run: make test-jayway JSONPATH_COMPARISON_DIR="$GITHUB_WORKSPACE/json-path-comparison"

  kind-e2e:
    name: Kind end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      # The cluster name must match KIND_CLUSTER in the Makefile: the e2e
      # targets address the cluster through the kind-authz-e2e context.
      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: authz-e2e

      - name: Build and load images
        run: make e2e-images

      - name: Deploy the harness
        run: make e2e-harness

      - name: Install the chart
        run: make e2e-install

      - name: Run the runtime suite
        run: make e2e-suite

      - name: Collect logs
        if: always()
        run: make e2e-logs

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-e2e-logs
          path: test/artifacts/kind
          if-no-files-found: ignore

  kind-parity:
    name: Parity on kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.1

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: authz-e2e

      - name: Build and load images
        run: make e2e-images

      - name: Deploy the parity harness
        run: make parity-harness

      - name: Install the chart
        run: make parity-install

      - name: Run the parity suite
        run: make parity-suite

      - name: Collect logs
        if: always()
        run: make parity-logs

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kind-parity-logs
          path: test/artifacts/kind/parity
          if-no-files-found: ignore

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    needs: [rego, chart, integration-compile, jsonpath-jayway, kind-e2e, kind-parity]
    if: always()
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' >/dev/null
