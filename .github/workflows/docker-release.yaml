---
# Release of the two Docker images, the agent and authz-policy-admin. Forked
# from the organisation's template,
# https://github.com/Netcracker/.github/blob/main/workflow-templates/docker-release.yaml,
# with the dry-run input and the tag cleanup on failure this repository had
# before.
#
# Triggered by hand with the release version. The jobs check that the tag is
# free, read the component list from .qubership/docker.cfg, create the tag,
# build and publish both images from it, and publish the GitHub release,
# whose notes netcracker/release-drafter composes from the merged pull
# requests per .github/release-drafter-config.yml. A failed build deletes the
# tag again, so the next attempt starts clean. With dry-run the tag is not
# pushed, the images are built from the branch and not pushed, and no
# release is made.
#
# Secrets: GITHUB_TOKEN alone, for the tag, the packages and the release.
# arm64 stays in the platforms of .qubership/docker.cfg; do not build amd64
# only.

name: "Docker Images Release"
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Release version e.g. 1.0.0 (numbers and dots only). "v" prefix will be added automatically.'
        required: true
        type: string
      dry-run:
        description: 'Check the tag and build the images without pushing a tag, an image or a release.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
run-name: ${{ github.repository }} Release ${{ github.event.inputs.release }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIG_FILE: '.qubership/docker.cfg'

jobs:
  check-tag:
    name: "Check if tag exists"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Check if tag exists"
        id: check_tag
        uses: netcracker/qubership-workflow-hub/actions/tag-action@288a6a0d9a78e80dfdefccab1be6497a39deb746  # v2.8.0
        with:
          tag-name: 'v${{ inputs.release }}'
          ref: ${{ github.ref }}
          create-tag: false
          check-tag: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  resolve-config:
    name: "Load Docker Build Components Configuration"
    needs: [check-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      config: ${{ steps.resolve.outputs.config }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # config-resolver in its docker mode: the same output as the deprecated
      # docker-config-resolver the template names, with stricter validation.
      - name: "Resolve docker config"
        id: resolve
        uses: netcracker/qubership-workflow-hub/actions/config-resolver@288a6a0d9a78e80dfdefccab1be6497a39deb746 # v2.8.0
        with:
          file-path: ${{ env.CONFIG_FILE }}

  create-tag:
    name: "Create Release Tag"
    needs: [resolve-config]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Create Tag"
        uses: netcracker/qubership-workflow-hub/actions/tag-action@288a6a0d9a78e80dfdefccab1be6497a39deb746  # v2.8.0
        with:
          tag-name: 'v${{ inputs.release }}'
          ref: ${{ github.ref }}
          create-tag: true
          check-tag: false
          dry-run: ${{ inputs.dry-run }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: "${{ matrix.component.name }}"
    needs: [resolve-config, create-tag]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        component: ${{ fromJson(needs.resolve-config.outputs.config) }}
    steps:
      # A dry run has pushed no tag, so it builds the branch the run started
      # from; a release builds the tag just created.
      - name: "Docker build and publish"
        uses: netcracker/qubership-workflow-hub/actions/docker-action@288a6a0d9a78e80dfdefccab1be6497a39deb746  # v2.8.0
        with:
          ref: ${{ inputs.dry-run && github.ref || format('v{0}', inputs.release) }}
          download-artifact: false
          dry-run: ${{ inputs.dry-run }}
          component: ${{ toJson(matrix.component) }}
          platforms: ${{ matrix.component.platforms }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # On the build's own failure only: failure() alone is true when an ancestor
  # failed, and a run refused by check-tag because the version is already
  # released would then delete that release's tag.
  cleanup-on-fail:
    name: "Delete the tag of a failed build"
    needs: [docker-build]
    if: ${{ failure() && needs.docker-build.result == 'failure' && !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Delete Tag"
        uses: netcracker/qubership-workflow-hub/actions/tag-action@288a6a0d9a78e80dfdefccab1be6497a39deb746  # v2.8.0
        with:
          tag-name: 'v${{ inputs.release }}'
          ref: ${{ github.ref }}
          create-tag: false
          delete-tag: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    name: "Github Release"
    needs: [docker-build]
    if: ${{ !inputs.dry-run }}
    continue-on-error: false
    permissions:
      contents: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: v${{ inputs.release }}
          persist-credentials: false

      - name: "Release-drafter"
        uses: netcracker/release-drafter@130c08399304912ffe90e9604e4328f2fdcd7619  # v1.0.1
        with:
          config-name: release-drafter-config.yml
          publish: true
          name: ${{ inputs.release }}
          tag: v${{ inputs.release }}
          version: ${{ inputs.release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
