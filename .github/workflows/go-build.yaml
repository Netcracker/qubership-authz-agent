---
# Build workflow for qubership-authz-agent.
#
# Delegates to the shared Go build workflow in qubership-core-infra, which runs
# go test, SonarQube analysis, and Docker image builds.
#
# Module configuration note
# -------------------------
# This repository has five Go modules:
#   .                              — the product module (two binaries, zero external deps)
#   test/parity/suite              — parity-replay test suite
#   test/integration/testify       — runtime integration suite (needs a running stack)
#   test/integration/pipstub       — pip-stub service used by the integration suite
#   test/integration/tenantmanager — tenant-manager emulator the agent calls in the kind harness
#
# The shared workflow takes a single go-module-dir and would only build and test
# the product module.  The explicit go-module-configs list below makes all five
# modules visible so CI does not silently skip the test suites.
#
# The integration-tagged suites are not built here: without -tags integration
# the compiler leaves those files out, so this workflow covers the non-integration
# tests only.  integration-tests.yaml compiles the tagged suites and runs the
# runtime suite against the Helm chart on a kind cluster.
#
# After the build, scan-images runs Grype and Trivy over the images the build
# pushed and uploads the findings to code scanning (Security tab); see the
# comment on scan-targets. security-scan.yml repeats the scan daily for CVEs
# published after the build.

name: CI

run-name: >
  CI —
  ${{ github.event_name == 'push' && format('push [{0}]', github.event.head_commit.message) || '' }}
  ${{ github.event_name == 'pull_request' && format('PR ({0}) [{1}]', github.head_ref, github.event.pull_request.title) || '' }}

on:
  push:
    branches:
      - main
      - 'lts/**'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # The name of this job and of the workflow are kept to one word each: the
  # reusable workflows prepend their own job names, and the check ends up as
  # "CI / Go / Build Docker image / Build Docker Images (<component>, ...)".
  # Anything longer here pushes the component name out of view.
  build:
    name: Go
    # Explicit grant matching what generic-go-build.yaml declares for itself;
    # a caller without a permissions block would hand over the default token.
    permissions:
      contents: read
      pull-requests: write
      packages: write
    uses: Netcracker/qubership-core-infra/.github/workflows/generic-go-build.yaml@ed95ad948025728db1e613a3e1a4e6a11186f541 # v2.6.2
    with:
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
      # Explicit module list — see the comment at the top of this file for why
      # these entries exist rather than relying on auto-discovery.
      go-module-configs: |
        [
          {"dir": ".",                        "cover-packages": "./..."},
          {"dir": "test/parity/suite",        "cover-packages": "./..."},
          {"dir": "test/integration/testify", "cover-packages": "./..."},
          {"dir": "test/integration/pipstub", "cover-packages": "./..."},
          {"dir": "test/integration/tenantmanager", "cover-packages": "./..."}
        ]
    # The shared workflow declares exactly one secret; pass it explicitly
    # instead of `secrets: inherit` (zizmor: secrets-inherit).
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # The images the build job pushed for this commit, by digest. Which images
  # to scan is the security.scan flag of .qubership/docker.cfg, the file the
  # organisation's security-scan template reads; the build itself publishes
  # the components of .github/docker-dev-config.json, which lists the same
  # images. The shared workflow exposes no outputs, so the tag is rebuilt the
  # way its metadata step names it: the branch with "/" replaced by "-", a
  # dash, and the first seven characters of GITHUB_SHA (main-58316ca). A fork
  # pull request pushes nothing and is skipped.
  scan-targets:
    name: Images to scan
    needs: [build]
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .qubership/docker.cfg
          sparse-checkout-cone-mode: false

      - name: Resolve docker config
        id: config
        uses: netcracker/qubership-workflow-hub/actions/config-resolver@e6afd0a6bcc4f24d73e3e4d5fb9a31ada009e3f1 # v2.8.2
        with:
          file-path: .qubership/docker.cfg

      - name: Resolve the image digests
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          CONFIG: ${{ steps.config.outputs.config }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          docker login ghcr.io -u "$ACTOR" --password-stdin <<< "$GH_TOKEN"
          tag="${REF_NAME//\//-}-${GITHUB_SHA::7}"
          images=()
          for image in $(jq -r '.[] | select(.security_scan == true) | .image | ascii_downcase' <<< "$CONFIG"); do
            digest="$(docker buildx imagetools inspect "$image:${tag,,}" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "$image:${tag,,} is $image@$digest"
            images+=("$image@$digest")
          done
          echo "images=$(printf '%s\n' "${images[@]}" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  # Grype and Trivy over each image, HIGH and CRITICAL only, results uploaded
  # as SARIF to the repository's code scanning. The scan reports and does not
  # gate: the shared workflow runs both scanners with failing turned off, and
  # a CVE published against a base image would otherwise fail every unrelated
  # pull request. A scan that cannot run fails the job (continue-on-error).
  # Scanning by digest keeps one code-scanning category per image and branch,
  # so a later scan of the branch closes the alerts an earlier one opened.
  scan-images:
    name: Scan
    needs: [scan-targets]
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.scan-targets.outputs.images) }}
    uses: netcracker/qubership-workflow-hub/.github/workflows/re-security-scan.yml@e6afd0a6bcc4f24d73e3e4d5fb9a31ada009e3f1 # v2.8.2
    with:
      target: docker
      image: ${{ matrix.image }}
      continue-on-error: false
      # The shared workflow installs the latest release otherwise.
      trivy-version: v0.74.0
      grype-version: v0.120.1

  build-gate:
    name: Build gate
    runs-on: ubuntu-latest
    permissions: {}
    needs: [build]
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      - name: Check build result
        env:
          RESULT: ${{ needs.build.result }}
        run: test "$RESULT" = "success"
