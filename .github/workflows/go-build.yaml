---
# Build workflow for qubership-authz-agent.
#
# Delegates to the shared Go build workflow in qubership-core-infra, which runs
# go test, SonarQube analysis, Codecov uploads, and Docker image builds.
#
# Module configuration note
# -------------------------
# This repository has five Go modules:
#   .                              — the product module (two binaries, zero external deps)
#   test/parity/suite              — parity-replay test suite
#   test/integration/testify       — runtime integration suite (needs a running stack)
#   test/integration/pipstub       — pip-stub service used by the integration suite
#   test/integration/tenantmanager — tenant-manager emulator the agent calls in the kind harness
#
# The shared workflow takes a single go-module-dir and would only build and test
# the product module.  The explicit go-module-configs list below makes all five
# modules visible so CI does not silently skip the test suites.
#
# The integration-tagged suites are not built here: without -tags integration
# the compiler leaves those files out, so this workflow covers the non-integration
# tests only.  integration-tests.yaml compiles the tagged suites and runs the
# runtime suite against the Helm chart on a kind cluster.

name: CI

run-name: >
  CI —
  ${{ github.event_name == 'push' && format('push [{0}]', github.event.head_commit.message) || '' }}
  ${{ github.event_name == 'pull_request' && format('PR ({0}) [{1}]', github.head_ref, github.event.pull_request.title) || '' }}

on:
  push:
    branches:
      - main
      - 'lts/**'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # The name of this job and of the workflow are kept to one word each: the
  # reusable workflows prepend their own job names, and the check ends up as
  # "CI / Go / Build Docker image / Build Docker Images (<component>, ...)".
  # Anything longer here pushes the component name out of view.
  build:
    name: Go
    # Explicit grant matching what generic-go-build.yaml declares for itself;
    # a caller without a permissions block would hand over the default token.
    permissions:
      contents: read
      pull-requests: write
      packages: write
    uses: Netcracker/qubership-core-infra/.github/workflows/generic-go-build.yaml@91f0316488bc6ab88d060261caa1ebddd6706094 # v2.7.0
    with:
      sonar-project-key: ${{ vars.SONAR_PROJECT_KEY }}
      # Uploads each module's coverage profile to Codecov from the test run that
      # feeds Sonar; codecov.yml ignores test/**, so only the product module
      # reaches the report.  codecov-fail-on-error keeps its default of false,
      # so an upload that Codecov rejects fails neither this job nor Build gate.
      codecov-upload: true
      # Explicit module list — see the comment at the top of this file for why
      # these entries exist rather than relying on auto-discovery.
      go-module-configs: |
        [
          {"dir": ".",                        "cover-packages": "./..."},
          {"dir": "test/parity/suite",        "cover-packages": "./..."},
          {"dir": "test/integration/testify", "cover-packages": "./..."},
          {"dir": "test/integration/pipstub", "cover-packages": "./..."},
          {"dir": "test/integration/tenantmanager", "cover-packages": "./..."}
        ]
    # The shared workflow declares SONAR_TOKEN and the optional CODECOV_TOKEN;
    # pass them explicitly instead of `secrets: inherit` (zizmor: secrets-inherit).
    # A pull request from a fork gets neither, and Codecov accepts its upload
    # without a token because this repository is public.
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build-gate:
    name: Build gate
    runs-on: ubuntu-latest
    permissions: {}
    needs: [build]
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      - name: Check build result
        env:
          RESULT: ${{ needs.build.result }}
        run: test "$RESULT" = "success"
